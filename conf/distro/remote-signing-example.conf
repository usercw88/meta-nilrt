# Example local.conf configuration for remote signing
# Copy these settings to your build/conf/local.conf and customize

# =====================================================================
# Remote Signing Configuration
# =====================================================================

# Enable remote signing (recommended for production)
UEFI_REMOTE_SIGNING = "1"

# Signing server URL
# Replace with your actual signing server endpoint
UEFI_SIGNING_SERVER_URL = "https://signing-server.example.com/api/v1/sign"

# Authentication method: "token", "cert", or "none"
UEFI_SIGNING_AUTH_METHOD = "token"

# Authentication token (keep this secret!)
# DO NOT commit this to version control
# Set via environment variable or read from secret file
UEFI_SIGNING_AUTH_TOKEN = "${@os.getenv('SIGNING_TOKEN', '')}"

# Alternative: Certificate-based authentication
# UEFI_SIGNING_AUTH_METHOD = "cert"
# UEFI_SIGNING_CLIENT_CERT = "/path/to/client-cert.pem"
# UEFI_SIGNING_CLIENT_KEY = "/path/to/client-key.pem"

# Component type identifier
# This tells the signing server which key to use
UEFI_COMPONENT_TYPE = "nilrt-kernel"

# Timeout and retry settings
UEFI_SIGNING_TIMEOUT = "300"
UEFI_SIGNING_RETRIES = "3"
UEFI_SIGNING_RETRY_DELAY = "5"

# Verify signatures after signing
UEFI_VERIFY_SIGNED = "1"

# =====================================================================
# For development with local signing, set:
# =====================================================================
# UEFI_REMOTE_SIGNING = "0"
# UEFI_SB_DB_KEY = "/path/to/db.key"
# UEFI_SB_DB_CERT = "/path/to/db.crt"
